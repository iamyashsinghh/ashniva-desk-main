server {
  # nginx-unprivileged cannot bind port 80; docker-compose maps WEB_PORT to 8080.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API access: the browser calls /api/... on this host and nginx forwards it to the
  # API container. No CORS configuration or absolute API URL is needed in the web build.
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Socket.IO (real-time updates) also lives on the API.
  #
  # The forwarded headers are set here for the same reason they are set on /api/: the API is
  # configured to trust exactly one hop, and a hop that forwards nothing leaves it reading this
  # container's address as the client's and plain http as the scheme. The websocket handshake is
  # an ordinary HTTP request and is rate-limited like one.
  location /ws/ {
    proxy_pass http://api:3000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Single-page app: unknown paths fall back to index.html so React Router can handle them.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed build assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy no-referrer;
}
