# Ashniva Desk — local development environment.
#
#   docker compose up -d                 # infrastructure only (postgres, redis, minio)
#   docker compose --profile app up -d   # also build and run the API and web containers
#   bash scripts/mac-preview.sh          # non-technical preview on macOS (uses the app profile)
#
# Day-to-day development runs the API and web app on the host (pnpm dev) against
# these services, so hot reload works. The "app" profile runs the production images
# locally (previews, image verification). No host directories are mounted into the app
# containers: dependencies and the compiled code live inside the images.

# Pinned so the project — and therefore the named volumes below — does not depend on what the
# checkout directory happens to be called. Without it Compose derives the project from the folder
# name, so unpacking a new ZIP into a differently named directory silently starts an empty
# database instead of reusing the existing one. Override per machine with COMPOSE_PROJECT_NAME
# in .env, or `docker compose -p <name>`, both of which still win over this.
name: ashniva-desk

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ashniva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashniva_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ashniva_desk}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `$$` keeps the expansion inside the container, so the role and database come from the
      # server's own environment — the ones initdb actually created — instead of being
      # interpolated on the host from .env. A host without those variables would otherwise probe
      # a different role, which postgres rejects and logs as `FATAL: role "…" does not exist`.
      # Probing over TCP (not the Unix socket) also means "healthy" is only reported once the
      # server accepts the connections the API makes, never during the entrypoint's temporary
      # socket-only init phase.
      test:
        [
          'CMD-SHELL',
          'pg_isready --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ashniva}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ashniva_dev_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot job: creates the development bucket so the API can start without manual setup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-ashniva} ${MINIO_ROOT_PASSWORD:-ashniva_dev_password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-ashniva-desk-dev} &&
      echo 'bucket ready'
      "

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ashniva-desk/api:local
    restart: unless-stopped
    # The image entrypoint: "start" applies migrations then starts the API.
    # scripts/mac-preview.sh also runs it with "migrate" and "seed" as one-off commands.
    command: ['start']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ashniva}:${POSTGRES_PASSWORD:-ashniva_dev_password}@postgres:5432/${POSTGRES_DB:-ashniva_desk}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${MINIO_BUCKET:-ashniva-desk-dev}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-ashniva}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ashniva_dev_password}
      STORAGE_FORCE_PATH_STYLE: 'true'
      # False even here: the minio-init job above has already created the bucket, and the API
      # refuses this setting with NODE_ENV=production — creating a bucket on demand turns a
      # mistyped STORAGE_BUCKET into a new, empty, unbacked-up bucket instead of an error.
      STORAGE_AUTO_CREATE_BUCKET: 'false'
      # nginx in the web container proxies /api and /ws to this service and sets X-Forwarded-For
      # and X-Forwarded-Proto, so exactly one hop is trusted. Without it every request would look
      # to the rate limiter like it came from the web container.
      #
      # THE INVARIANT THIS DEPENDS ON: nginx is the only ingress. Trusting one hop means the API
      # believes the last entry of X-Forwarded-For and X-Forwarded-Proto, because it believes
      # whoever spoke to it directly wrote them. For a request that did *not* come through nginx,
      # hop 1 is the client itself — so it picks its own rate-limit bucket and its own scheme, and
      # a plain-http request can mark the refresh cookie `Secure`. That is why the API's port is
      # published on loopback only (see `ports:` below): it stays reachable from this machine, for
      # the health check, the smoke test and curl, and is not an ingress for anything else. A
      # deployment that exposes the API to a network directly must set TRUST_PROXY to false.
      TRUST_PROXY: '1'
      # Local-preview secrets only. Real deployments inject these from a secret store.
      JWT_ACCESS_SECRET: local-preview-access-secret-not-for-production-01
      JWT_REFRESH_SECRET: local-preview-refresh-secret-not-for-production-01
      # Encrypts stored integration credentials (Phase 3). Without it the integration screens
      # fail at the first encrypt(). The fallback is a fixed, published, local-preview value —
      # it is not a secret and must never be used anywhere real. Set APP_ENCRYPTION_KEY in .env
      # to override it; generate one with `openssl rand -base64 32`.
      #
      # A real deployment does not use this file at all, and there the key is REQUIRED: with
      # NODE_ENV=production and no key the API refuses to start rather than storing credentials
      # in the clear (apps/api/src/config/env.schema.ts).
      #
      # Changing the key does not re-encrypt what is already stored. Anything saved under the old
      # key stops being readable, and those credentials have to be entered again.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-YXNobml2YS1sb2NhbC1wcmV2aWV3LWtleS0wMDAwMDE=}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-ChangeMe123!}
      # The seed refuses to load demo accounts under NODE_ENV=production unless this is set.
      # It is set here because this compose file IS the local preview, never a real deployment.
      ALLOW_DEMO_SEED: 'true'
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      # Required with NODE_ENV=production, because invitation and password-reset links are built
      # from it. In this preview the web app really is on localhost, so that is what it says.
      APP_WEB_URL: http://localhost:${WEB_PORT:-5173}
      # /api/docs is off by default with NODE_ENV=production. This stack is a preview whose whole
      # point is looking at the running product — scripts/mac-preview.sh even prints the URL — so
      # it is turned back on here, deliberately and in one place.
      API_DOCS_ENABLED: 'true'
      LOG_LEVEL: info
    ports:
      # Loopback only, because TRUST_PROXY above is 1. Published on 0.0.0.0 the API is a second
      # ingress that skips nginx, and for those requests the trusted hop is the caller: it chooses
      # its own X-Forwarded-For and X-Forwarded-Proto. Everything that used this port still works
      # — the preview scripts, the CI smoke test and any browser on this machine all reach it as
      # localhost — it is simply no longer offered to the network.
      - '127.0.0.1:${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relative: nginx inside the web container forwards /api to the API container.
        VITE_API_BASE_URL: /api/v1
    image: ashniva-desk/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-5173}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
